name: Windows engine

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "windows/**"
      - "Packages/KuvoLink/**"
      - ".github/workflows/windows-engine.yml"

permissions:
  contents: read

concurrency:
  group: windows-engine-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bootstrap:
    name: engine bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Test the engine bootstrap
        run: node --test "windows/*.test.mjs"

      - name: Test the conversation view's client, transcript and server
        run: node --test "windows/harness/harness.test.mjs"

      - name: Test the link bridge
        run: node --test "Packages/KuvoLink/Tests/Bridge/*.test.js"

  windows:
    name: engine on Windows, end to end
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Test the engine bootstrap
        run: node --test "windows/*.test.mjs"

      - name: Test the conversation view's client, transcript and server
        run: node --test "windows/harness/harness.test.mjs"

      - name: Test the link bridge
        run: node --test "Packages/KuvoLink/Tests/Bridge/*.test.js"

      # Downloads the pinned Windows build, checks it against npm's checksum, starts it and
      # asks it for its info: the same road a client takes, on the platform it ships to.
      - name: Install and run the pinned engine
        run: node windows/kuvo-engine.mjs e2e

      # And the whole loop the page takes, on the engine that step installed: a session, a
      # prompt, the answer streaming in, and the page's own code in a DOM reading it back.
      # The engine answers it with one of its public free models, so this needs no account.
      - name: The live loop, and the page against the real engine
        env:
          KUVO_HARNESS_LIVE: "1"
        working-directory: windows/harness
        run: |
          npm install --no-audit --no-fund
          npm run test:live

      # The same harness packed into one executable: this runner's own node.exe, the bundled
      # code, and the page carried inside. Windows is where an .exe can be made — and driven.
      - name: Build the Windows executable
        working-directory: windows/harness
        run: |
          npm install --no-audit --no-fund
          npm run build:exe

      - name: Prove the executable serves the page by itself
        working-directory: windows/harness
        run: npm run smoke:exe -- build/kuvo-windows-harness.exe

      - name: Keep the executable for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kuvo-windows-harness-x64
          path: windows/harness/build/kuvo-windows-harness.exe
          if-no-files-found: error

  shell:
    name: native shell (Electron) on Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # The shell wraps the harness executable, so build that first.
      - name: Build the harness executable
        working-directory: windows/harness
        run: |
          npm install --no-audit --no-fund
          npm run build:exe

      # node-pty is a native module: it needs the MSVC developer environment to build.
      - name: Set up the MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the shell
        working-directory: windows/electron
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Prove the shell starts
        working-directory: windows/electron
        run: npm run smoke -- "dist/win-unpacked/Kuvo Code.exe"

      - name: Keep the installer and the portable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kuvo-windows-shell-x64
          path: |
            windows/electron/dist/*.exe
          if-no-files-found: error
