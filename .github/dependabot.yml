# Swift packages are pinned in the Xcode project, which Dependabot can't update;
# update them by hand (see CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The Windows client's three npm manifests. The page, the harness and the shell
  # have separate lockfiles, so each gets its own update stream.
  - package-ecosystem: npm
    directory: /windows/app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /windows/harness
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /windows/electron
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
