<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data:; font-src 'self' data:;">
<title>Kuvo Code</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/vendor/xterm.css">
</head>
<body>
<header>
  <div class="brand">Kuvo&nbsp;Code</div>
  <button id="project" class="path" title="Change the project folder"></button>
  <div class="spacer"></div>
  <button id="toggle-files" class="small" title="Files and terminal">Files</button>
  <button id="export" class="small" title="Export conversation as Markdown">Export</button>
  <div id="engine" class="engine" title="The engine on this machine"></div>
</header>

<main>
  <aside>
    <div class="aside-head">
      <span>Sessions</span>
      <button id="new-session" class="small">New</button>
    </div>
    <input id="session-search" class="file-search" placeholder="Search sessions…" spellcheck="false">
    <input id="message-search" class="file-search" placeholder="Search messages…" spellcheck="false">
    <div id="message-search-results" class="search-results" hidden></div>
    <ul id="sessions"></ul>
    <div id="sessions-empty" class="aside-empty">No sessions yet.</div>
  </aside>

  <section id="conversation">
    <div id="session-tabs" class="session-tabs" hidden></div>
    <div id="empty" class="empty">
      <h1>Start with a folder</h1>
      <p>Pick the project to work in, then say what you want done. The agent reads, edits and runs things in that folder, asking first.</p>
      <button id="choose" class="primary">Choose a folder</button>
      <button id="start" class="primary" hidden>Start a session</button>
    </div>
    <div id="entries" class="entries"></div>
    <div id="asks" class="asks"></div>
    <form id="composer" class="composer" hidden>
      <textarea id="prompt" rows="3" placeholder="Ask for something…  (Enter sends, Shift+Enter for a new line)"></textarea>
      <div class="composer-foot">
        <select id="model" title="Model"></select>
        <div class="spacer"></div>
        <button id="stop" type="button" class="small" hidden>Stop</button>
        <button id="send" class="primary" type="submit">Send</button>
      </div>
    </form>
  </section>
</main>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-head">
    <div class="drawer-tabs">
      <button class="drawer-tab active" data-tab="files">Files</button>
      <button class="drawer-tab" data-tab="terminal">Terminal</button>
    </div>
    <button id="drawer-close" class="small">✕</button>
  </div>
  <div id="drawer-files" class="drawer-body">
    <div class="file-tree-head">
      <button id="files-refresh" class="small">Refresh</button>
      <button id="files-new-file" class="small">+ File</button>
      <button id="files-new-folder" class="small">+ Folder</button>
      <button id="files-delete" class="small">Delete</button>
      <span id="files-root" class="note"></span>
    </div>
    <input id="files-search" class="file-search" placeholder="Search in project…" spellcheck="false">
    <div id="files-search-results" class="search-results" hidden></div>
    <div id="git-status" class="git-status" hidden></div>
    <button id="git-diff" class="small" hidden>Show git diff</button>
    <ul id="file-tree" class="file-tree"></ul>
    <div id="file-editor" class="file-editor" hidden>
      <div class="file-editor-head">
        <span id="file-name" class="note"></span>
        <button id="file-save" class="small primary">Save</button>
      </div>
      <textarea id="file-content" spellcheck="false"></textarea>
    </div>
  </div>
  <div id="drawer-terminal" class="drawer-body" hidden>
    <div id="terminal" class="terminal"></div>
    <div id="terminal-note" class="note"></div>
  </div>
</div>

<div id="diff-modal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <strong id="diff-title">Diff</strong>
      <button id="diff-close" class="small">✕</button>
    </div>
    <pre id="diff-body" class="diff-body"></pre>
  </div>
</div>

<div id="picker" class="picker" hidden>
  <div class="picker-card">
    <div class="picker-head">
      <strong>Project folder</strong>
      <button id="picker-close" class="small">✕</button>
    </div>
    <div class="picker-row">
      <button id="picker-up" class="small" title="Up">↑</button>
      <input id="picker-path" spellcheck="false">
      <button id="picker-go" class="small">Go</button>
    </div>
    <ul id="picker-folders"></ul>
    <div class="picker-foot">
      <span id="picker-note" class="note"></span>
      <button id="picker-use" class="primary">Use this folder</button>
    </div>
  </div>
</div>

<script src="/vendor/xterm.min.js"></script>
<script src="/vendor/addon-fit.min.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
