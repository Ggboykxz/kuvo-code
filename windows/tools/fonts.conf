<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The fonts the captures are taken with, for the machines that have no system fonts of
     their own: Liberation for the interface, and DejaVu for the rest. -->
<fontconfig>
  <dir>/nix/store/0l2dc446f8kyk1naz14dj0pgandriwma-liberation-fonts-2.1.5/share/fonts</dir>
  <dir>/nix/store/1mjlla0fc468wl9cphnn2ivpfx02mr7j-dejavu-fonts-minimal-2.37/share/fonts</dir>
  <cachedir>/tmp/kuvo-fontcache</cachedir>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Mono</string></edit>
  </match>
</fontconfig>
